# MeetMind AI - Spring Boot Application Properties
server.port=${SERVER_PORT:8085}

# MongoDB Configuration
# Compatible with local MongoDB Community Server and MongoDB Compass
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:meetmind_db}

# AI Agent Service (Python + Flask + Groq)
meetmind.ai-agent.url=${AI_AGENT_URL:http://localhost:5001}
meetmind.ai-agent.connect-timeout-ms=5000
meetmind.ai-agent.read-timeout-ms=60000

# CORS Configuration
meetmind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Application Logging
logging.level.com.meetmind=INFO
logging.level.org.springframework.data.mongodb=INFO
