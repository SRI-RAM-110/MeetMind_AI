# MeetMind AI - Spring Boot Application Properties
server.port=${PORT:${SERVER_PORT:8085}}
server.address=0.0.0.0

# MongoDB Configuration
# Supports both MongoDB Atlas (mongodb+srv://...) and local MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/meetmind_db}}

# AI Agent Service (Python + Flask + Groq)
meetmind.ai-agent.url=${MEETMIND_AI_AGENT_URL:${AI_AGENT_URL:http://localhost:5001}}
meetmind.ai-agent.connect-timeout-ms=${AI_AGENT_CONNECT_TIMEOUT_MS:10000}
meetmind.ai-agent.read-timeout-ms=${AI_AGENT_READ_TIMEOUT_MS:120000}

# CORS Configuration
meetmind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Application Logging
logging.level.com.meetmind=INFO
logging.level.org.springframework.data.mongodb=INFO
